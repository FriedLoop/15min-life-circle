services:
  app:
    build: .
    container_name: 15min-life-circle
    ports:
      - "8000:8000"

    # AK 等敏感配置**不进镜像**（见 .dockerignore），全部在运行时注入。
    # 两种注入方式任选，以下两条会自然合并，命令行注入优先：
    #
    #   1) 一行命令注入，不需要编辑任何文件：
    #        BAIDU_SERVER_AK=xxx BAIDU_BROWSER_AK=yyy docker compose up --build
    #      （Windows PowerShell：
    #        $env:BAIDU_SERVER_AK="xxx"; $env:BAIDU_BROWSER_AK="yyy"; docker compose up --build）
    #
    #   2) 走配置文件：复制 backend/.env.example 为 backend/.env 后填写
    #
    # 注意 environment 必须用「只列变量名」的列表写法：
    # 若写成 `BAIDU_SERVER_AK: ${BAIDU_SERVER_AK:-}`，未设置时会被解析成空字符串，
    # 而 environment 的优先级高于 env_file —— 空值会**覆盖掉 backend/.env 里的真实 AK**，
    # 表现为"明明填了 AK 却提示未配置"。列表写法只在宿主机真的设置了该变量时才注入。
    environment:
      - BAIDU_SERVER_AK
      - BAIDU_BROWSER_AK

    # 该文件可能不存在（.env 被 .gitignore 排除，评审 clone 后没有），
    # 因此必须声明 required: false —— 否则 compose 会在第一步直接报错退出，
    # 而不是把服务起起来、在页面上如实提示"后端缺 AK 配置"。
    env_file:
      - path: backend/.env
        required: false

    restart: unless-stopped
