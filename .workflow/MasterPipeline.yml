version: "1.0"
name: 代码检查与测试
displayName: 代码检查与测试
stages:
- name: 代码检查与测试
  displayName: 代码检查与测试
  strategy: naturally
  trigger: auto
  steps:
  - step: build@python
    name: ""
    displayName: 安装依赖、运行测试与代码检查
    pythonVersion: "3.11"
    commands:
    - pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
    - python --version
    - pip install -r backend/requirements.txt
    - python -m pytest backend/tests/ -v
    - ruff check backend/
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
