name: CI

# 触发：推送到 master / dev、对这两个分支的 PR、以及手动触发
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  test:
    name: 测试与代码检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 静态检查（ruff）
        run: ruff check backend/

      - name: 单元测试（pytest）
        run: python -m pytest backend/tests/ -v

      - name: 应用可导入性冒烟检查
        run: python -c "import sys; sys.path.insert(0, 'backend'); from main import app; print('FastAPI app 导入正常')"
