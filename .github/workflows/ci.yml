name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  test:
    name: 测试与代码检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 静态检查（ruff）
        run: ruff check backend/

      - name: 单元测试（pytest）
        run: python -m pytest backend/tests/ -v

      - name: 应用可导入性冒烟检查
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); from main import app; print('FastAPI app 导入正常')"

      # 交付要求自检：核对交付物、密钥安全、环境变量文档一致性、API 契约，
      # 以及赛题《交付要求》《评审维度》的逐条证据。
      # lint 与测试在上方已单独执行，故此处跳过以免重复。
      - name: 交付要求自检
        run: python backend/scripts/delivery_check.py --no-lint --no-test

  docker:
    name: Docker 一键部署验证
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t 15min-life-circle:ci .

      - name: 启动容器并验证服务与前端可访问
        run: |
          docker run -d --name app -p 8000:8000 15min-life-circle:ci

          # 等待服务就绪，最多 60 秒
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" != "1" ]; then
            echo "::error::服务在 60 秒内未就绪"
            docker logs app
            exit 1
          fi

          echo "--- /api/health ---"
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8000/api/health | grep -q '"status":"ok"'

          echo "--- 前端页面（根路径应直接返回应用界面）---"
          curl -fsS http://localhost:8000/ | grep -q '<html'

          echo "Docker 一键部署验证通过：评审按 README 启动后可直接访问服务与前端"

      - name: 失败时输出容器日志
        if: failure()
        run: docker logs app || true
